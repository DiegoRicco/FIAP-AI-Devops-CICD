[pytest]
testpaths = tests
addopts = -q
# neo4j: testes de homologacao que precisam de um Neo4j real (QC_NEO4J_URI) e
# do modelo de embedding; sem eles, pulam sozinhos. Registrar o marker evita o
# PytestUnknownMarkWarning e permite rodar so eles: pytest -m neo4j
markers =
    neo4j: precisa de Neo4j real (QC_NEO4J_URI) e do modelo de embedding
