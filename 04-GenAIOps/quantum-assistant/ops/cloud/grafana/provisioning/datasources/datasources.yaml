# Tres fontes de dados ligadas entre si (correlacao de 3 vias), todas INTERNAS
# a rede do compose na EC2 qc-assistant-obs. So o Grafana sai pelo ALB (com
# login); Prometheus, Loki e Jaeger nao tem porta publica e o navegador nunca fala
# com eles direto (access: proxy = o servidor do Grafana faz a consulta).
#   log (Loki)           -> trace (Jaeger) pelo campo trace_id da linha JSON
#   trace (Jaeger)       -> logs (Loki) do mesmo trace_id
#   metrica (Prometheus) -> trace (Jaeger) quando houver exemplar com trace_id
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # O trace_id esta dentro da linha JSON; a regex o extrai e vira link no
      # detalhe de cada log. Link RELATIVO para o dashboard de investigacao, com
      # o sub-path /grafana: o Grafana fica atras do ALB em /grafana, e um link
      # comecando em /d/... cairia na regra default do ALB (o assistente live).
      derivedFields:
        - name: trace_id
          matcherType: regex
          # Pega o trace_id tanto na linha JSON crua quanto na linha formatada
          # pelo dashboard de investigacao (trace_id=<32 hex>).
          matcherRegex: '(?:"trace_id": ?"|trace_id=)([0-9a-f]{32})'
          url: "/grafana/d/qc-investigacao?var-trace_id=$${__value.raw}&viewPanel=panel-50&from=now-30m&to=now"
          urlDisplayLabel: "Ver este trace (Jaeger) no painel"
        # A UI do Jaeger NAO e publica: so abre com o tunel do SSM
        # (aws ssm start-session ... AWS-StartPortForwardingSession, porta 16686).
        - name: trace_id_jaeger
          matcherType: regex
          matcherRegex: '(?:"trace_id": ?"|trace_id=)([0-9a-f]{32})'
          url: "http://127.0.0.1:16686/trace/$${__value.raw}"
          urlDisplayLabel: "Abrir no Jaeger (via SSM port-forward 16686)"

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service_name=~"qc-.+"} |= "$${__trace.traceId}"'
