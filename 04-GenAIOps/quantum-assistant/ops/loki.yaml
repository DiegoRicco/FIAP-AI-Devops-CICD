# Loki em modo single binary, so para a aula: um processo, indice e chunks no
# disco do proprio container (somem no `docker compose down`, como o Jaeger e
# o Prometheus deste stack). Sem multi-tenant (auth_enabled: false) porque so
# escuta em 127.0.0.1 e quem le e o Grafana local.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # O Collector le os arquivos desde o inicio: linhas de horas atras precisam
  # ser aceitas quando o stack e recriado no meio da aula.
  reject_old_samples: false
  allow_structured_metadata: true
  volume_enabled: true

ingester:
  # Sem isso o Loki espera 15 s antes de ficar "ready"; na aula queremos o log
  # no Grafana logo depois do bootstrap.
  lifecycler:
    min_ready_duration: 0s
    final_sleep: 0s

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        # Cache pequeno: cabe no mem_limit de 256m do compose.
        max_size_mb: 32

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
